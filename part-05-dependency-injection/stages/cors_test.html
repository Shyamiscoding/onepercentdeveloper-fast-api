<!doctype html>
<!-- Stage 5 helper — serve with:  cd stages && python -m http.server 3000 -->
<html>
<head><meta charset="utf-8"><title>CORS test — Stage 5</title></head>
<body style="font-family: system-ui; max-width: 640px; margin: 40px auto;">
  <h1>CORS test</h1>
  <p>This page's origin: <code id="origin"></code></p>
  <button id="go">fetch http://127.0.0.1:8000/rates</button>
  <pre id="out" style="background:#111;color:#eee;padding:16px;"></pre>
  <script>
    document.getElementById("origin").textContent = location.origin;
    document.getElementById("go").onclick = async () => {
      const out = document.getElementById("out");
      try {
        const res = await fetch("http://127.0.0.1:8000/rates", { credentials: "include" });
        const body = await res.json();
        out.textContent = "OK — allowed by CORS\n" +
          "X-Process-Time-ms: " + res.headers.get("X-Process-Time-ms") + "\n\n" +
          JSON.stringify(body, null, 2);
      } catch (err) {
        out.textContent = "BLOCKED — open DevTools → Console to see the CORS error.\n" + err;
      }
    };
  </script>
</body>
</html>
